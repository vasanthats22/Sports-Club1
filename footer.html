<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Club - Footer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /*==========================
        FOOTER — SAME BG AS HEADER
        ATHLETIC NAVY + CHAMPIONSHIP GOLD
        ==========================*/
        footer {
            background: #0A1F44;
            padding: 44px 0 32px;
            margin-top: auto;
            position: relative;
            border-top: 3px solid #F5B301;
            box-shadow: 0 -6px 26px rgba(10, 31, 68, 0.25);
        }

        .footer-container {
            max-width: 1280px;
            width: 92%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        /*==========================
        ROW 1 — LOGO (LEFT) + NAV (RIGHT)
        ==========================*/
        .footer-row-1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Logo — Left — 60px */
        .footer-brand {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .footer-brand img {
            height: 60px;
            display: block;
            transition: all 0.3s ease;
        }

        .footer-brand:hover img {
            opacity: 0.85;
            transform: scale(1.03);
        }

        /* Nav — Right */
        .footer-nav {
            display: flex;
            align-items: center;
            gap: 36px;
            flex-wrap: wrap;
        }

        .footer-nav a {
            font-size: 15px;
            font-weight: 600;
            color: #E6ECF5;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            padding: 4px 0;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .footer-nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2.5px;
            background: #F5B301;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .footer-nav a:hover {
            color: #F5B301;
        }

        .footer-nav a:hover::after {
            width: 100%;
        }

        /*==========================
        DIVIDER
        ==========================*/
        .footer-divider {
            width: 100%;
            height: 1.5px;
            background: rgba(245, 179, 1, 0.18);
            border-radius: 2px;
        }

        /*==========================
        ROW 2 — SENTENCE (LEFT) + SOCIAL ICONS (RIGHT)
        ==========================*/
        .footer-row-2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Sentence — Left */
        .footer-tagline {
            font-size: 15px;
            font-weight: 500;
            color: #B9C4D6;
            line-height: 1.6;
            letter-spacing: 0.2px;
            max-width: 620px;
        }

        .footer-tagline .highlight {
            color: #F5B301;
            font-weight: 700;
        }

        /* Social Icons — Right */
        .footer-social {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .footer-social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(245, 179, 1, 0.12);
            color: #F5B301;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 17px;
            border: 1px solid rgba(245, 179, 1, 0.28);
        }

        .footer-social a:hover {
            background: #F5B301;
            color: #0A1F44;
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(245, 179, 1, 0.45);
            border-color: #F5B301;
        }

        /*==========================
        MOBILE VIEW
        ==========================*/
        .mobile-only {
            display: none;
        }

        .mobile-nav-menu {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding: 14px 0;
            width: 100%;
        }

        .mobile-nav-menu.open {
            display: flex;
        }

        .mobile-nav-menu a {
            font-size: 15px;
            font-weight: 600;
            color: #E6ECF5;
            text-decoration: none;
            padding: 10px 0;
            border-bottom: 1px solid rgba(245, 179, 1, 0.15);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .mobile-nav-menu a:hover {
            color: #F5B301;
            padding-left: 8px;
            border-bottom-color: #F5B301;
        }

        @media(max-width: 768px) {
            footer {
                background: #0A1F44;
                padding: 26px 0 22px;
                border-top: 3px solid #F5B301;
            }

            .footer-container {
                width: 92%;
                gap: 14px;
                align-items: stretch;
            }

            .footer-row-1,
            .footer-row-2,
            .footer-divider {
                display: none;
            }

            .mobile-only {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }

            .mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                padding-bottom: 12px;
                border-bottom: 1px solid rgba(245, 179, 1, 0.18);
            }

            .mobile-header .mobile-logo img {
                height: 60px;
                display: block;
            }

            .mobile-hamburger {
                background: rgba(245, 179, 1, 0.12);
                border: 1px solid rgba(245, 179, 1, 0.28);
                cursor: pointer;
                padding: 10px 12px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                border-radius: 8px;
                transition: all 0.3s ease;
            }

            .mobile-hamburger:hover {
                background: #F5B301;
                border-color: #F5B301;
            }

            .mobile-hamburger span {
                display: block;
                width: 22px;
                height: 2.5px;
                background: #F5B301;
                border-radius: 2px;
                transition: all 0.3s ease;
            }

            .mobile-hamburger span:nth-child(2) {
                width: 16px;
            }

            .mobile-hamburger:hover span {
                background: #0A1F44;
            }

            .mobile-text {
                font-size: 14px;
                font-weight: 500;
                color: #B9C4D6;
                line-height: 1.6;
                text-align: left;
                padding: 4px 0;
            }

            .mobile-text .highlight {
                color: #F5B301;
                font-weight: 700;
            }

            .mobile-social-label {
                font-size: 14px;
                font-weight: 600;
                color: #E6ECF5;
                text-align: left;
                margin-top: 4px;
                text-transform: uppercase;
                letter-spacing: 0.4px;
            }

            .mobile-social {
                display: flex;
                align-items: center;
                gap: 14px;
                justify-content: flex-start;
                padding: 4px 0;
                flex-wrap: wrap;
            }

            .mobile-social a {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: rgba(245, 179, 1, 0.12);
                color: #F5B301;
                text-decoration: none;
                transition: all 0.3s ease;
                font-size: 17px;
                border: 1px solid rgba(245, 179, 1, 0.28);
            }

            .mobile-social a:hover {
                background: #F5B301;
                color: #0A1F44;
                transform: translateY(-3px);
                box-shadow: 0 8px 24px rgba(245, 179, 1, 0.45);
                border-color: #F5B301;
            }
        }

        @media(max-width: 480px) {
            footer {
                background: #0A1F44;
                padding: 22px 0 18px;
            }

            .footer-container {
                width: 94%;
                gap: 12px;
            }

            .mobile-header .mobile-logo img {
                height: 60px;
            }

            .mobile-hamburger {
                padding: 8px 10px;
            }

            .mobile-hamburger span {
                width: 18px;
                height: 2px;
            }

            .mobile-hamburger span:nth-child(2) {
                width: 12px;
            }

            .mobile-text {
                font-size: 13px;
            }

            .mobile-social-label {
                font-size: 13px;
            }

            .mobile-social {
                gap: 12px;
            }

            .mobile-social a {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }
        }

        @media(min-width: 769px) {
            .mobile-only {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="footer-container">

            <!-- ===== DESKTOP VIEW ===== -->

            <!-- ROW 1: Logo (left) + Nav (right) -->
            <div class="footer-row-1">
                <a href="index.html" class="footer-brand">
                    <img src="SLogo.webp" alt="Sports Club">
                </a>
                <nav class="footer-nav">
                    <a href="index.html">Home</a>
                    <a href="teams.html">Teams</a>
                    <a href="schedule.html">Schedule</a>
                    <a href="membership.html">Membership</a>
                    <a href="contact.html">Contact</a>
                </nav>
            </div>

            <div class="footer-divider"></div>

            <!-- ROW 2: Sentence (left) + Social Icons (right) -->
            <div class="footer-row-2">
                <p class="footer-tagline">
                    Champions are made here. <span class="highlight">Train. Compete. Win.</span>
                </p>
                <div class="footer-social">
                    <a href="404.html" aria-label="Facebook" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="404.html" aria-label="Instagram" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="404.html" aria-label="YouTube" title="YouTube">
                        <i class="fab fa-youtube"></i>
                    </a>
                    <a href="404.html" aria-label="X (Twitter)" title="X (Twitter)">
                        <i class="fab fa-x-twitter"></i>
                    </a>
                    <a href="404.html" aria-label="LinkedIn" title="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                </div>
            </div>

            <!-- ===== MOBILE VIEW ===== -->
            <div class="mobile-only">
                <div class="mobile-header">
                    <a href="index.html" class="mobile-logo">
                        <img src="SLogo.webp" alt="Sports Club">
                    </a>
                    <button class="mobile-hamburger" id="mobileHamburger" aria-label="Toggle menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>

                <div class="mobile-nav-menu" id="mobileNavMenu">
                    <a href="index.html">Home</a>
                    <a href="teams.html">Teams</a>
                    <a href="schedule.html">Schedule</a>
                    <a href="membership.html">Membership</a>
                    <a href="contact.html">Contact</a>
                </div>

                <div class="mobile-text">
                    Champions are made here. <span class="highlight">Train. Compete. Win.</span>
                </div>

                <div class="mobile-social-label">Follow us</div>

                <div class="footer-divider" style="display:block; margin: 4px 0;"></div>

                <div class="mobile-social">
                    <a href="404.html" aria-label="Facebook" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="404.html" aria-label="Instagram" title="Instagram">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="404.html" aria-label="YouTube" title="YouTube">
                        <i class="fab fa-youtube"></i>
                    </a>
                    <a href="404.html" aria-label="X (Twitter)" title="X (Twitter)">
                        <i class="fab fa-x-twitter"></i>
                    </a>
                    <a href="404.html" aria-label="LinkedIn" title="LinkedIn">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                </div>
            </div>

        </div>
    </footer>

    <script>
        // SOCIAL ICONS → 404.html
        const allSocialLinks = document.querySelectorAll('.footer-social a, .mobile-social a');
        allSocialLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = this.getAttribute('href');
            });
        });

        // FOOTER NAV LINKS
        const footerNavLinks = document.querySelectorAll('.footer-nav a');
        const mobileNavLinks = document.querySelectorAll('.mobile-nav-menu a');

        footerNavLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = this.getAttribute('href');
            });
        });

        mobileNavLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('mobileNavMenu').classList.remove('open');
                window.location.href = this.getAttribute('href');
            });
        });

        // MOBILE HAMBURGER TOGGLE
        const hamburger = document.getElementById('mobileHamburger');
        const mobileNavMenu = document.getElementById('mobileNavMenu');

        if (hamburger && mobileNavMenu) {
            hamburger.addEventListener('click', function() {
                mobileNavMenu.classList.toggle('open');
            });
        }

        console.log("✅ Sports Club footer ready!");
        console.log("📐 Row 1: Logo (left) + Nav (right)");
        console.log("📐 Row 2: Sentence (left) + Social Icons (right)");
        console.log("🖼️ Logo: 60px · 🎨 Navy #0A1F44 + Gold #F5B301");
    </script>

</body>
</html>
