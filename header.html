<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Club - Header</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
        }

        /*==========================
        HEADER / NAVBAR - FIXED AT TOP
        SPORTS CLUB: ATHLETIC NAVY + CHAMPIONSHIP GOLD
        ==========================*/
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            padding: 12px 0;
            background: transparent;
            transition: all 0.3s ease;
        }

        body {
            padding-top: 104px;
        }

        .header-container {
            width: 94%;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 80px;
            background: #0A1F44;                              /* Athletic Navy */
            border-radius: 16px;
            box-shadow: 0 4px 22px rgba(10, 31, 68, 0.25),
                        inset 0 -3px 0 0 #F5B301;              /* gold strip */
            transition: all 0.35s ease;
            border: 1px solid rgba(245, 179, 1, 0.18);
        }

        header.scrolled .header-container {
            background: #061530;                              /* darker navy on scroll */
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35),
                        inset 0 -3px 0 0 #F5B301;
            height: 74px;
            border-color: rgba(245, 179, 1, 0.28);
        }

        /*==========================
        LOGO - 60px desktop / 56px scrolled
        ==========================*/
        .logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .logo img {
            height: 60px;
            display: block;
            transition: all 0.3s ease;
        }

        header.scrolled .logo img {
            height: 56px;
        }

        /*==========================
        DESKTOP NAV - Center (5 SPORTS CLUB links)
        ==========================*/
        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 32px;
            flex: 1;
            justify-content: center;
            margin: 0 20px;
        }

        .desktop-nav a {
            font-size: 15px;
            font-weight: 600;
            color: #E6ECF5;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            padding: 6px 0;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .desktop-nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2.5px;
            background: #F5B301;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .desktop-nav a:hover {
            color: #F5B301;
        }

        .desktop-nav a:hover::after,
        .desktop-nav a.active::after {
            width: 100%;
        }

        .desktop-nav a.active {
            color: #F5B301;
            font-weight: 800;
        }

        /*==========================
        RIGHT SIDE - Login & Sign up
        ==========================*/
        .right-side {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .login-btn {
            font-size: 14px;
            font-weight: 600;
            color: #FFFFFF;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 9px 20px;
            border-radius: 40px;
            cursor: pointer;
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .login-btn:hover {
            color: #0A1F44;
            background: #F5B301;
            border-color: #F5B301;
        }

        .signup-btn {
            background: #F5B301;
            color: #0A1F44;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.35s ease;
            border: none;
            cursor: pointer;
            display: inline-block;
            box-shadow: 0 4px 14px rgba(245, 179, 1, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .signup-btn:hover {
            background: #FFC933;
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(245, 179, 1, 0.55);
        }

        /*==========================
        MOBILE HAMBURGER MENU
        ==========================*/
        .menu-btn {
            width: 42px;
            height: 42px;
            background: rgba(245, 179, 1, 0.15);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(245, 179, 1, 0.35);
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(245, 179, 1, 0.3);
        }

        .menu-btn i {
            color: #F5B301;
            font-size: 18px;
        }

        /*==========================
        MOBILE MENU OVERLAY
        ==========================*/
        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(6, 21, 48, 0.7);
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mobile-menu-overlay.open {
            display: block;
            opacity: 1;
        }

        /*==========================
        MOBILE MENU
        ==========================*/
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 340px;
            height: 100vh;
            background: #0A1F44;
            padding: 28px 20px;
            transition: all 0.4s ease;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.35);
            overflow-y: auto;
            border-left: 4px solid #F5B301;
        }

        .mobile-menu.open {
            right: 0;
        }

        .mobile-menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(245, 179, 1, 0.25);
        }

        .mobile-menu-header .mobile-logo img {
            height: 52px;
            display: block;
        }

        .close-btn {
            font-size: 24px;
            color: #FFFFFF;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: #F5B301;
            transform: rotate(90deg);
        }

        .mobile-nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .mobile-nav-links a {
            font-size: 16px;
            font-weight: 600;
            color: #E6ECF5;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .mobile-nav-links a:hover {
            background: rgba(245, 179, 1, 0.12);
            color: #F5B301;
            border-left-color: #F5B301;
        }

        .mobile-nav-links a.active {
            background: rgba(245, 179, 1, 0.18);
            color: #F5B301;
            font-weight: 800;
            border-left-color: #F5B301;
        }

        .mobile-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
            padding-top: 18px;
            border-top: 1px solid rgba(245, 179, 1, 0.25);
        }

        .mobile-actions .login-mobile {
            text-align: center;
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 40px;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .mobile-actions .login-mobile:hover {
            background: rgba(245, 179, 1, 0.15);
            border-color: #F5B301;
            color: #F5B301;
        }

        .mobile-actions .signup-mobile {
            text-align: center;
            padding: 10px;
            font-weight: 800;
            font-size: 14px;
            color: #0A1F44;
            text-decoration: none;
            border-radius: 40px;
            background: #F5B301;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(245, 179, 1, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mobile-actions .signup-mobile:hover {
            background: #FFC933;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(245, 179, 1, 0.55);
        }

        /*==========================
        RESPONSIVE BREAKPOINTS
        ==========================*/
        @media(max-width: 1024px) {
            .desktop-nav {
                gap: 22px;
                margin: 0 12px;
            }
            .desktop-nav a {
                font-size: 13px;
            }
            .right-side {
                gap: 10px;
            }
            .signup-btn {
                padding: 10px 20px;
                font-size: 13px;
            }
            .login-btn {
                padding: 9px 16px;
                font-size: 13px;
            }
            .header-container {
                height: 76px;
            }
            header.scrolled .header-container {
                height: 72px;
            }
            .logo img {
                height: 56px;
            }
            header.scrolled .logo img {
                height: 52px;
            }
        }

        @media(max-width: 868px) {
            .desktop-nav {
                display: none;
            }
            .right-side {
                display: none;
            }
            .menu-btn {
                display: flex;
            }
            .header-container {
                height: 74px;
                padding: 0 16px;
                border-radius: 12px;
            }
            .logo img {
                height: 52px;
            }
            header.scrolled .logo img {
                height: 52px;
            }
            body {
                padding-top: 96px;
            }
        }

        @media(max-width: 480px) {
            header {
                padding: 8px 0;
            }
            .header-container {
                width: 100%;
                border-radius: 0;
                padding: 0 14px;
                height: 74px;
                background: #0A1F44;
                box-shadow: 0 2px 12px rgba(10, 31, 68, 0.25),
                            inset 0 -3px 0 0 #F5B301;
            }
            .logo img {
                height: 52px;
            }
            header.scrolled .logo img {
                height: 52px;
            }
            .menu-btn {
                width: 40px;
                height: 40px;
            }
            .menu-btn i {
                font-size: 17px;
            }
            .mobile-menu {
                width: 100%;
                max-width: 100%;
                padding: 20px 16px;
            }
            .mobile-menu-header {
                margin-bottom: 20px;
                padding-bottom: 12px;
            }
            .mobile-menu-header .mobile-logo img {
                height: 52px;
            }
            .mobile-nav-links {
                gap: 6px;
            }
            .mobile-nav-links a {
                font-size: 15px;
                padding: 11px 14px;
            }
            .mobile-actions .login-mobile,
            .mobile-actions .signup-mobile {
                padding: 9px;
                font-size: 13px;
            }
            body {
                padding-top: 90px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER / NAVBAR ===== -->
    <header id="mainHeader">
        <div class="header-container">

            <!-- LOGO - Left -->
            <div class="logo">
                <a href="index.html">
                    <img src="SLogo.webp" alt="Sports Club">
                </a>
            </div>

            <!-- DESKTOP NAV - Center (5 SPORTS CLUB buttons) -->
            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="teams.html">Teams</a>
                <a href="schedule.html">Schedule</a>
                <a href="membership.html">Membership</a>
                <a href="contact.html">Contact</a>
            </nav>

            <!-- RIGHT SIDE - Login & Sign up -->
            <div class="right-side">
                <a href="login.html" class="login-btn">Login</a>
                <a href="signup.html" class="signup-btn">Join Now</a>
            </div>

            <!-- MOBILE HAMBURGER -->
            <button class="menu-btn" id="menuBtn">
                <i class="fas fa-bars"></i>
            </button>

        </div>
    </header>

    <!-- ===== MOBILE MENU OVERLAY ===== -->
    <div class="mobile-menu-overlay" id="mobileOverlay"></div>

    <!-- ===== MOBILE MENU ===== -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-header">
            <a href="index.html" class="mobile-logo">
                <img src="SLogo.webp" alt="Sports Club">
            </a>
            <button class="close-btn" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="mobile-nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="teams.html">Teams</a>
            <a href="schedule.html">Schedule</a>
            <a href="membership.html">Membership</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="mobile-actions">
            <a href="login.html" class="login-mobile">Login</a>
            <a href="signup.html" class="signup-mobile">Join Now</a>
        </div>
    </div>

    <script>
        // ===========================
        // ELEMENTS
        // ===========================
        const menuBtn = document.getElementById("menuBtn");
        const closeBtn = document.getElementById("closeBtn");
        const mobileMenu = document.getElementById("mobileMenu");
        const mobileOverlay = document.getElementById("mobileOverlay");
        const mobileLinks = mobileMenu.querySelectorAll("a");
        const header = document.getElementById("mainHeader");

        // ===========================
        // OPEN MENU
        // ===========================
        function openMenu() {
            mobileMenu.classList.add("open");
            mobileOverlay.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        menuBtn.addEventListener("click", function(e) {
            e.preventDefault();
            e.stopPropagation();
            openMenu();
        });

        // ===========================
        // CLOSE MENU
        // ===========================
        function closeMenu() {
            mobileMenu.classList.remove("open");
            mobileOverlay.classList.remove("open");
            document.body.style.overflow = "auto";
        }

        closeBtn.addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
        });
        mobileOverlay.addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
        });

        // ===========================
        // CLOSE WHEN LINK CLICKED
        // ===========================
        mobileLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                const href = this.getAttribute("href");
                closeMenu();
                setTimeout(() => {
                    window.location.href = href;
                }, 200);
            });
        });

        // ===========================
        // ESC KEY
        // ===========================
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeMenu();
            }
        });

        // ===========================
        // SCROLL EFFECT
        // ===========================
        window.addEventListener("scroll", () => {
            if (window.scrollY > 20) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        // ===========================
        // ACTIVE PAGE HIGHLIGHTING
        // ===========================
        const desktopLinks = document.querySelectorAll(".desktop-nav a");
        const allMobileLinks = document.querySelectorAll(".mobile-nav-links a");

        function setActiveLink(links, clickedLink) {
            links.forEach(link => link.classList.remove("active"));
            clickedLink.classList.add("active");
        }

        const currentPage = window.location.pathname.split("/").pop() || "index.html";

        desktopLinks.forEach(link => {
            const href = link.getAttribute("href");
            if (href === currentPage) {
                link.classList.add("active");
            }
        });

        allMobileLinks.forEach(link => {
            const href = link.getAttribute("href");
            if (href === currentPage) {
                link.classList.add("active");
            }
        });

        // ===========================
        // REDIRECT FUNCTIONALITY
        // ===========================
        desktopLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                const href = this.getAttribute("href");
                setActiveLink(desktopLinks, this);
                window.location.href = href;
            });
        });

        allMobileLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                const href = this.getAttribute("href");
                setActiveLink(allMobileLinks, this);
                closeMenu();
                setTimeout(() => {
                    window.location.href = href;
                }, 200);
            });
        });

        // Desktop Login & Signup
        document.querySelector(".login-btn").addEventListener("click", function(e) {
            e.preventDefault();
            window.location.href = this.getAttribute("href");
        });

        document.querySelector(".signup-btn").addEventListener("click", function(e) {
            e.preventDefault();
            window.location.href = this.getAttribute("href");
        });

        // Mobile Login & Signup
        document.querySelector(".login-mobile").addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
            setTimeout(() => {
                window.location.href = this.getAttribute("href");
            }, 200);
        });

        document.querySelector(".signup-mobile").addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
            setTimeout(() => {
                window.location.href = this.getAttribute("href");
            }, 200);
        });

        console.log("✅ Sports Club header ready!");
        console.log("🏆 Nav: Home · Teams · Schedule · Membership · Contact");
        console.log("🖼️ Logo sizes: 60px → 56px → 52px (device responsive)");
        console.log("🎨 Athletic Navy (#0A1F44) + Championship Gold (#F5B301)");
    </script>

</body>

</html>
